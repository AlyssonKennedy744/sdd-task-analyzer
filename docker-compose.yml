# Orquestração local da suíte de testes (Fase 3).
# Uso: docker compose run --rm tests
services:
  tests:
    build:
      context: .
      dockerfile: Dockerfile
    image: sdd-task-analyzer:latest
    pull_policy: build
    command: ["pytest", "tests/test_harness.py", "-v"]
    network_mode: none
    read_only: true
    tmpfs:
      - /tmp
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTEST_ADDOPTS: "-p no:cacheprovider"
