# Pipeline de Integração Contínua do TaskAnalyzer (Fase 3).
# Regras IN-01 a IN-04 de CONTEXT_RULES.md: nenhum merge sem build verde,
# sem continue-on-error e sem alterar os testes para "passar".
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test Harness (pytest - Python 3.11)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v5

      - name: Configurar Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependências (requirements.txt)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Executar o Test Harness
        run: pytest tests/test_harness.py -v

  docker:
    name: Docker (build + docker compose run)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v5

      - name: Build da imagem (python:3.11-slim)
        run: docker build -t sdd-task-analyzer:ci .

      - name: Executar a suíte isolada no container
        run: docker compose run --rm tests
